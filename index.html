<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Quote Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="quote-card">
    <div class="quote-icon">“</div>
    <p id="quote-text" class="quote-text">Loading inspirational quote...</p>
    <p id="quote-author" class="quote-author">- Author</p>
    <div class="btn-group">
      <button id="new-quote-btn" class="btn">New Quote</button>
      <button id="copy-btn" class="btn btn-outline">Copy</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
